services:
  wppconnect:
    container_name: wpp-server
    build:
      context: .
      dockerfile: Dockerfile
    image: wppconnect/wppconnect-server:local
    restart: unless-stopped
    networks:
      - chatwoot_net
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PORT: "21465"
      HOST: "http://localhost"
      SECRET_KEY: "${SECRET_KEY:-THISISMYSECURETOKEN}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      TOKEN_STORE_TYPE: "${TOKEN_STORE_TYPE:-file}"
      CUSTOM_USER_DATA_DIR: "/usr/src/wpp-server/userDataDir/"
    volumes:
      - ./wppData/wppconnect_tokens:/usr/src/wpp-server/tokens
      - ./wppData/wppconnect_user_data:/usr/src/wpp-server/userDataDir
      - ./wppData/wppconnect_uploads:/usr/src/wpp-server/uploads
      - ./wppData/wppconnect_images:/usr/src/wpp-server/WhatsAppImages
      - ./wppData/wppconnect_logs:/usr/src/wpp-server/log
    ports:
      - "21465:21465"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT:-21465}/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  wppconnect_tokens: {}
  wppconnect_user_data: {}
  wppconnect_uploads: {}
  wppconnect_images: {}
  wppconnect_logs: {}

networks:
  chatwoot_net:
    external: true
  n8n_n8n-net:
    external: true
